packages:
  - packages/*

# pnpm 11 把设置搬到了 pnpm-workspace.yaml（写在 package.json 的 `pnpm` 字段已不再被读取，
# .npmrc 的 `only-built-dependencies[]` 同样被忽略）。
# esbuild 需要它的安装脚本落下平台二进制，而两个包的打包步骤都要用它。
# 注意 `allowBuilds` 的值必须是布尔：pnpm 报错时给的模板是 "set this to true or false"。
allowBuilds:
  esbuild: true

# pnpm 11 默认有 minimumReleaseAge（新发布的包要等一段时间才允许装），而 `dsh-remote-wire`
# 是本家协议包、发布后立刻要被消费仓装上，所以按**精确版本**放行。
# 协议升版时若又撞上这个闸门，pnpm 会自己往这里加一条新版本；别改成通配——
# 通配等于对整个生态的新发布关掉这道供应链防线。
minimumReleaseAgeExclude:
  - dsh-remote-wire@1.0.0
  - dsh-remote-wire@1.1.0

onlyBuiltDependencies:
  - esbuild
