name: Release

# 打一个 `v*` 标签即发布：先跑一遍完整校验（与 CI 同款，标签也可能打在坏提交上），
# 版本号对得上标签之后，把插件包发布到 npm（带 provenance），再建一个 GitHub Release。
#
# 本仓只发**一个** npm 包：`dsh-remote-control`。`packages/presentation` 是
# `private: true`，不进 npm——它随 `scripts/install-to-profile.sh` 以 bundle 形式装进 profile。
#
# 前置条件（仓库公开、账号就绪后一次性配好）：
#   · repository secret `NPM_TOKEN` —— npm 的 Automation token，需有发包权限；
#   · 用 npm 的 **Trusted Publishing** 时可以不配 token，但仍需要 `id-token: write`（已给）。
# provenance 由插件包 package.json 的 `publishConfig.provenance: true` 打开。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: verify, publish to npm, tag release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成 release notes 需要完整历史

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # 同 CI：lockfile 已提交（协议包上了 npm 之后生成的），冻结安装。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check, format check, build, tests
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm test

      - name: Verify the tag matches the published package version
        env:
          # 通过 env 传事件字段，避免把可被影响的值直接插进脚本。
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          tag="${TAG_NAME#v}"
          version="$(node -p "require('./packages/plugin/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "标签 v$tag ≠ packages/plugin 里的版本 $version"
            exit 1
          fi
          echo "版本一致：$version"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # -r 会跳过 `private: true` 的包，所以这里实际只发 dsh-remote-control 一个；
        # 无 scope 的包要显式 --access public。
        run: pnpm -r publish --access public --no-git-checks

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag
